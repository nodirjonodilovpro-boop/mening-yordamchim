<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mening yordamchim</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- KIRISH OYNASI -->
<div id="login">
  <div class="lcard">
    <div class="logo">
      <img src="logo.jpg" alt="Mening yordamchim" style="width: 80px !important; height: 80px !important; object-fit: cover; border-radius: 16px; margin: 0 auto 12px auto; display: block;">
    </div>
    <h2>Mening yordamchim</h2>
    <p id="lSub">Hisobingizga kiring</p>

    <div class="tabs">
      <button type="button" id="tabLogin" class="on">Kirish</button>
      <button type="button" id="tabReg">Ro‘yxatdan o‘tish</button>
    </div>

    <input id="lLogin" placeholder="Login" autocomplete="username">
    <div class="pw">
      <input id="lPass" type="password" placeholder="Parol" autocomplete="current-password">
      <button type="button" id="eye" title="Ko‘rsatish">👁</button>
    </div>
    <input id="lPass2" type="password" placeholder="Parolni takrorlang" style="display:none" autocomplete="new-password">

    <button id="lBtn" type="button">Kirish</button>
    <div id="lErr"></div>

    <div class="or"><span></span></div>
    <div id="gBtn"></div>
  </div>
</div>

<!-- ASOSIY SAHIFA -->
<div class="wrap" id="app" style="display:none">
  <div class="top">
    <h1><img src="logo.jpg" alt="Logo" class="top-logo" style="width: 28px !important; height: 28px !important; object-fit: cover; border-radius: 6px;"> Mening yordamchim</h1>
    <div class="me">
      <!-- Zamonaviy SVG Quyosh va Oycha ikonkali tugma -->
      <button class="theme-toggle" id="themeBtn" title="Mavzuni o‘zgartirish">
        <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <img id="meImg" src="logo.jpg" alt="Profil" title="Profil" style="width: 36px !important; height: 36px !important; min-width: 36px; min-height: 36px; border-radius: 50%; object-fit: cover; display: block;">
      <button class="mini" id="out">Chiqish</button>
    </div>
  </div>

  <nav id="nav">
    <button data-s="ishlar" class="on">✅ Ishlar</button>
    <button data-s="calc">🧮 Hisob</button>
    <button data-s="qarz">💰 Qarzlar</button>
    <button data-s="saytlar">🌐 Saytlarim</button>
  </nav>

  <!-- ISHLAR BO'LIMI -->
  <section id="ishlar" class="sec on">
    <div class="card">
      <div class="row1">
        <input id="tText" placeholder="Qanday ish? (masalan: Dorixonaga borish)">
      </div>
      <div class="row">
        <input id="tDate" type="date">
        <input id="tTime" type="time">
      </div>
      <button class="btn" id="tAdd">Ish qo‘shish</button>
      
      <div class="notif-box">
        <p>⏰ Eslatma sahifa ochiq turganda vaqti kelganda ovoz va xabar bilan chiqadi.</p>
        <button class="mini" id="notifBtn">🔔 Bildirishnomaga ruxsat berish</button>
      </div>
    </div>
    <div class="card" id="tList"></div>
  </section>

  <!-- HISOB BO'LIMI -->
  <section id="calc" class="sec">
    <div class="card calc">
      <div id="disp">0</div>
      <div class="keys" id="keys"></div>
    </div>
  </section>

  <!-- QARZLAR BO'LIMI -->
  <section id="qarz" class="sec">
    <div class="card">
      <div class="row">
        <input id="qIsm" placeholder="Ism">
        <input id="qFam" placeholder="Familiya">
      </div>
      <div class="row">
        <input id="qTel" type="tel" placeholder="Telefon raqam">
        <input id="qSum" type="number" inputmode="decimal" placeholder="Pul miqdori">
      </div>
      <div class="row">
        <select id="qTur">
          <option value="berdim">Men berdim (menga qaytaradi)</option>
          <option value="oldim">Men oldim (men qaytaraman)</option>
        </select>
        <input id="qIzoh" placeholder="Izoh (ixtiyoriy)">
      </div>
      <button class="btn" id="qAdd">Saqlash</button>
    </div>
    <div class="card"><div class="sum" id="qSum2"></div></div>
    <div class="card">
      <input id="qFind" placeholder="🔍 Ism yoki raqam bo‘yicha qidirish">
      <div id="qList"></div>
    </div>
  </section>

  <!-- SAYTLAR BO'LIMI -->
  <section id="saytlar" class="sec">
    <div class="card">
      <div class="row1">
        <input id="sUrl" placeholder="Sayt linki (https://...)">
      </div>
      <div class="row">
        <input id="sName" placeholder="Sayt nomi (ixtiyoriy)">
        <input id="sImg" type="file" accept="image/*">
      </div>
      <button class="btn" id="sAdd">Saytni qo‘shish</button>
      <p><small style="color:var(--muted)">Sayt rasmini (skrinshot) tanlasangiz kartada chiqadi. Tanlamasangiz, chiroyli rangli karta chiqadi. Kartaga bossangiz sayt ochiladi.</small></p>
    </div>
    <div class="sites" id="sList"></div>
  </section>
</div>

<div id="alarm">
  <div id="alarmT"></div>
  <button id="alarmX">Yopish</button>
</div>

</body>
